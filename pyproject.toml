[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "github-profile-inspector"
version = "1.0.0"
description = "CLI para consultar perfis públicos usando a API REST do GitHub"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Felipe Voigt" }]

[project.scripts]
github-profile-inspector = "github_profile_inspector:main"

[tool.setuptools]
py-modules = ["github_profile_inspector"]

